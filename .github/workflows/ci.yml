name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          runtime: node@22
          cache: true
          install: false

      - name: Install dependencies
        id: deps
        run: pnpm install --frozen-lockfile

      - name: Format diff preview (temporary)
        run: |
          pnpm format
          echo '=== FORMAT PATCH BEGIN ==='
          git diff --no-ext-diff --unified=3 -- extensions/codex-settings/model-probe/index.ts extensions/gkd-workflow/command.ts extensions/gkd-workflow/workflow.ts tests/gkd-fsm.test.mjs tests/gkd-host.test.mjs tests/model-probe.test.mjs
          echo '=== FORMAT PATCH END ==='

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm check

      - name: Test
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: pnpm test
